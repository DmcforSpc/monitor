name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project (dev extras)
        run: uv pip install --system -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src/
        continue-on-error: true  # advisory until the codebase is fully typed

  security:
    name: Security scans
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install scanners
        run: pip install "bandit[toml]>=1.7" "pip-audit>=2.7"

      - name: bandit (static analysis)
        run: bandit -r src/ -c pyproject.toml

      - name: pip-audit (CVE in dependencies)
        # Allow CI to continue on a transient pip-audit network failure but
        # surface anything otherwise. Use `--strict` so warnings count as fail.
        run: pip-audit --strict

  smoke:
    name: Import smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install project
        run: uv pip install --system -e .

      - name: CLI smoke
        run: |
          python -m src version
          python -m src list collectors
          python -m src list notifiers
          python -m src db init

      - name: Run pytest if tests/ is present
        run: |
          if [ -d tests ]; then
            uv pip install --system pytest pytest-cov
            pytest -v
          else
            echo "::notice::tests/ not present in repo (intentional) — skipping pytest"
          fi
        shell: bash
