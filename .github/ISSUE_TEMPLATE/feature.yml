name: ✨ Feature Request
description: Propose a new framework capability or default plugin
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest an improvement.

        Before filing: is this something that belongs in **the framework core**, in a
        **bundled default plugin**, or in your own **user-land plugin**? User-land
        plugins live in your repo, not this one.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case. Concrete examples are gold.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: API sketch, config knobs, expected behaviour. Pseudocode is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed and why you'd reject them.

  - type: checkboxes
    id: scope
    attributes:
      label: Where does this belong?
      options:
        - label: Framework core (`src/core`, `src/db`, `src/web`, `src/scheduler`)
        - label: Bundled default plugin (`src/collectors/*`, `src/notifiers/*`)
        - label: Documentation only
        - label: CI / tooling
        - label: Unsure — happy to discuss

  - type: checkboxes
    id: hygiene
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched existing issues and discussions
          required: true
