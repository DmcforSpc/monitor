# Quick-start local stack:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
#
# Override settings via .env in the project root (auto-loaded).
# A persistent volume keeps cve_monitor.db across container restarts.

services:
  cve-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: cve-monitor:latest
    container_name: cve-monitor
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Sensible production defaults — override via .env or compose.override.yml
      CVE_WEB_HOST: 0.0.0.0
      CVE_WEB_PORT: "8000"
      CVE_LOG_LEVEL: INFO
      CVE_LOG_JSON: "true"
      CVE_LOG_FILE: ""           # stdout only in containers
      CVE_DATABASE_URL: sqlite:////data/cve_monitor.db
      CVE_FETCH_INTERVAL_SECONDS: "300"
    env_file:
      - path: .env
        required: false
    volumes:
      - cve-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import httpx,sys; sys.exit(0 if httpx.get('http://127.0.0.1:8000/api/health', timeout=3).status_code==200 else 1)\""]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  cve-data:
    driver: local
