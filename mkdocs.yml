site_name: CVE Monitor
site_description: Extensible plugin-based security intelligence framework.
site_url: https://DmcforSpc.github.io/monitor/
site_author: DmcforSpc

repo_url: https://github.com/DmcforSpc/monitor
repo_name: DmcforSpc/monitor
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

nav:
  - 首页: index.md
  - 快速开始: getting-started.md
  - 架构: architecture.md
  - 插件开发:
      - 采集器: plugins/collectors.md
      - 通知渠道: plugins/notifiers.md
  - 部署:
      - Docker: deployment/docker.md
      - 安全: deployment/security.md
      - 观测性: deployment/observability.md
  - 参考:
      - CLI: reference/cli.md
      - REST API: reference/api.md
      - 配置: reference/configuration.md
      - 数据模型: reference/data-model.md
  - 更新日志: changelog.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      lang:
        - zh
        - en

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DmcforSpc/monitor

copyright: Copyright &copy; 2026 CVE Monitor Maintainers
