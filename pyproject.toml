[project]
name = "cve-monitor"
version = "1.0.0"
description = "可扩展的安全情报采集与推送平台（纯框架，业务靠插件式 collectors/notifiers 扩展）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CVE Monitor Maintainers" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "typer>=0.13",
    "apscheduler>=3.10",
    "jinja2>=3.1",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
]
observability = [
    "logfire[fastapi,sqlalchemy,httpx]>=2.0",
]

[project.scripts]
cve-monitor = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── uv ──────────────────────────────────────────────────────────────
[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

# ── ruff ────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ── mypy ────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

# ── pytest ──────────────────────────────────────────────────────────
# NOTE: do NOT put "src" on pythonpath — it would shadow stdlib `logging`
# because src/logging.py exists. Project is installed via `pip install -e .`
# so absolute imports like `from src.db.base import ...` resolve correctly.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

# ── bandit ──────────────────────────────────────────────────────────
# Static security analyser. Run locally:  bandit -r src/ -c pyproject.toml
[tool.bandit]
exclude_dirs = ["tests", "build", "dist", ".venv", "venv"]
# B608: hardcoded_sql_expressions — `text("SELECT 1")` in the /api/ready
#       probe is a literal, not user input. No injection surface.
skips = ["B608"]
